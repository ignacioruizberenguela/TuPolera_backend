# MySQL 8 para desarrollo local. Los microservicios se ejecutan con ./mvnw (ver README).
# Uso:  docker compose --env-file .env up -d
services:
  mysql:
    image: mysql:8.0
    container_name: tupolera-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: tupolera
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      # Solo accesible desde esta máquina (nunca exponer MySQL a Internet).
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
