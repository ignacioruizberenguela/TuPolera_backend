spring.application.name=backend


# Conexión a la base de datos MySQL en AWS RDS
spring.datasource.url=jdbc:mysql://tu-polera-database-1.ckykv2ovu6de.us-east-1.rds.amazonaws.com:3306/tupolera
spring.datasource.username=admin
spring.datasource.password=xxxxxxxxx

# Configuración del Driver de MySQL para Spring Boot
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate (Crea o actualiza las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Puerto en el que correrá tu backend localmente
server.port=8080
